plugins {
    id 'com.android.application'
}

android {
    namespace 'org.vledger.app'
    compileSdk 37

    defaultConfig {
        applicationId "org.vledger.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
